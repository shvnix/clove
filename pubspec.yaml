name: clove
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  change_app_package_name: ^1.5.0
  flutter_native_splash: ^2.4.8
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:

  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_foreground: assets/icon/icon.png
  adaptive_icon_background: "#FFFFFF"

flutter_native_splash:
  color: "#0B0B0B"
  image: assets/icon/splash.png

  android: true
  ios: true
  web: false

  android_12:
    color: "#0B0B0B"
    image: assets/icon/splash.png